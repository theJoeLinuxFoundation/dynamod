# The root is mounted read-only for fsck (the kernel's "ro") and made writable
# here. A root that is writable already is left alone: a live system's overlay
# refuses a remount ("No changes allowed in reconfigure"), and mount(8)
# reconfigures the superblock even when nothing changes.
[service]
name = "remount-root-rw"
supervisor = "early-boot"
exec = ["/bin/sh", "-c", "findmnt -n -o VFS-OPTIONS / | grep -qw ro || exit 0; exec /bin/mount -o remount,rw /"]
type = "oneshot"

[restart]
policy = "temporary"

[dependencies]
requires = ["fsck"]

[readiness]
type = "none"

[shutdown]
stop-signal = "SIGTERM"
stop-timeout = "3s"
